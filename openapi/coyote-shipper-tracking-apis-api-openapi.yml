        nextStop:
          $ref: '#/components/schemas/Coyote.Systems.ExternalApi.Contracts.Models.Tracking.LoadStop'
        estimatedArrivalDateTimeUtc:
          type:
          - string
          - 'null'
          description: ETA DateTime in Utc
          format: date-time
        nextStopDistance:
          $ref: '#/components/schemas/Coyote.Systems.ExternalApi.Contracts.Models.Tracking.Distance'
      additionalProperties: false
      description: Summary
    Coyote.Systems.ExternalApi.Contracts.Models.Tracking.TrackingAddress:
      type: object
      properties:
        line1:
          type:
          - string
          - 'null'
          description: Line 1
        line2:
          type:
          - string
          - 'null'
          description: Line 2
        line3:
          type:
          - string
          - 'null'
          description: Line 3
        postalCode:
          type:
          - string
          - 'null'
          description: Postal Code
        cityName:
          type:
          - string
          - 'null'
          description: City Name
        stateProvinceCode:
          type:
          - string
          - 'null'
          description: State or Province Code
        countryCode:
          type:
          - string
          - 'null'
