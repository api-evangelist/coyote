        line2:
          type:
          - string
          - 'null'
          description: Line2
        city:
          type:
          - string
          - 'null'
          description: City
        postalCode:
          type:
          - string
          - 'null'
          description: Postal Code
        state:
          type:
          - string
          - 'null'
          description: State
        countryCode:
          type:
          - string
          - 'null'
          description: Country Code
