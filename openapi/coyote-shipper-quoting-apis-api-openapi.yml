          format: date-time
        minTemperature:
          type: number
          description: Minimum Temperature (required if Equipment Type = R)
          format: double
          nullable: true
        maxTemperature:
          type: number
          description: Maximum Temperature (required if Equipment Type = R)
          format: double
          nullable: true
        weight:
          type: number
          description: Weight
          format: double
          nullable: true
        commodity:
          type: string
          description: Commodity
          nullable: true
        equipmentLength:
          type: number
          description: Equipment Length
          format: double
          nullable: true
        isHazmat:
          type: boolean
          description: Load is Hazmat __(currently unsupported)__
          nullable: true
        isDropTrailer:
          type: boolean
          description: Load Requires Drop Trailer __(currently unsupported)__
          nullable: true
